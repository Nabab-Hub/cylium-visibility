version: "3.8"

services:
  visibility-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visibility-model-api
    restart: unless-stopped
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - PORT=8003
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 5s
      retries: 3
